   const row=cloudUnwrap(await withCloudTimeout(async()=>{await ensureCloudClient();cloudAssert(!controller.signal.aborted,'云课堂配置加载已停止。');return cloud.database.from('farm_lesson_config').select('id,payload').eq('id','lesson-v1').single().abortSignal(controller.signal);},12000,()=>controller.abort()));
   cloudAssert(row?.id==='lesson-v1','固定课堂配置记录未找到。');applyLessonConfig(row.payload);
   lessonConnection.status='云课堂配置已加载 / 词汇和区域保持一致';
  }catch{
   lessonConnection.status='本页模式 / 云课堂配置未加载';lessonConnection.error='云课堂配置未加载，保留本页词汇；游戏可继续';
   notify(lessonConnection.error);
  }finally{controller?.abort();updateLessonStatus();}
 })().finally(()=>{cloudConfigPromise=null;});return cloudConfigPromise;
}
function startCloud(){return loadLessonConfig();}
function updateLessonStatus(){const status=$('#lesson-config-status');if(status)status.innerHTML=`${safe(lessonConnection.status)}${lessonConnection.error?'<br>'+safe(lessonConnection.error):''}`;}
render();
if(typeof window!=='undefined'&&window.location&&typeof document.createElement==='function'){if(window.location.protocol==='file:')lessonConnection.status='离线本页模式 / 不加载云课堂配置';else void startCloud();}
</script>
